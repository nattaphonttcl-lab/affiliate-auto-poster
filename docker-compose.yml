services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      IMAGE_STORAGE_BACKEND: local
      IMAGE_STORAGE_LOCAL_DIR: /app/generated_images
    volumes:
      - generated_images:/app/generated_images
      - backup_data:/backups
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/liveness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.production
    command: python -m app.workers.queue_worker
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

  retry-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.production
    command: python -m app.workers.retry_worker
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

  analytics-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.production
    command: python -m app.workers.analytics_worker
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

  cleanup-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.production
    command: python -m app.workers.cleanup_worker
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

  health-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.production
    command: python -m app.workers.health_worker
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app_net

  redis:
    image: redis:8.2-alpine
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.7.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_net

  loki:
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    networks:
      - app_net

  promtail:
    image: grafana/promtail:3.5.5
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - app_net

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  generated_images:
  backup_data:
  prometheus_data:
  grafana_data:
  loki_data:
