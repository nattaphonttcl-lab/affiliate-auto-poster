name: Backend CI

on:
  pull_request:
  push:
    branches: ["main", "develop"]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Pytest
        run: |
          python -m pytest -q | tee pytest-summary.txt

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-summary
          path: pytest-summary.txt

      - name: Append summary
        if: always()
        run: |
          echo "## Backend Test Summary" >> "$GITHUB_STEP_SUMMARY"
          cat pytest-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Bandit
        run: python -m bandit -q -r app

      - name: Dependency audit (Python)
        run: python -m pip_audit

  docker-validate:
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config >/dev/null

      - name: Build backend image
        run: docker build -t affiliate-auto-poster-backend:ci .

      - name: Build frontend image
        run: docker build -t affiliate-auto-poster-frontend:ci ./frontend
